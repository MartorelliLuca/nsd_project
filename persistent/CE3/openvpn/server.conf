port 1194
proto udp
dev tun

ca   /root/openvpn/keys/ca.crt
cert /root/openvpn/keys/CE3.crt
key  /root/openvpn/keys/CE3.key
dh   /root/openvpn/keys/dh.pem

server 10.8.0.0 255.255.255.0

push "route 192.168.1.0 255.255.255.0"    # Site 1 (CE1)
push "route 192.168.32.0 255.255.255.0"   # VLAN 32 (B1)
push "route 192.168.95.0 255.255.255.0"   # VLAN 95 (B2)
push "route 192.168.3.0 255.255.255.0"    # Site 3 (RADIUS)

# opzionale: permetti traffico diretto tra client via hub
client-to-client

keepalive 10 120
persist-key
persist-tun

user nobody
group nogroup

verb 3